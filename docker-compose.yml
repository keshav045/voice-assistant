version: '3.8'

services:
  nexus-voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_voice_assistant
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - PORT=8000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/voice_assistant.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - assistant-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  assistant-data:
    driver: local
